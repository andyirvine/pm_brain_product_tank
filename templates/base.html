<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Brain — Ledger</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Bootstrap grid only -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- App styles -->
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
</head>
<body>
<div class="app-wrapper">

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <nav class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-hex">⬡</span>
      <span class="brand-name">Product Brain</span>
      <span class="brand-pill">Ledger · Seed Stage</span>
    </div>

    <ul class="sidebar-nav">
      <li class="nav-section">Navigate</li>
      <li>
        <a href="/" class="{{ 'active' if request.endpoint == 'dashboard' }}">
          <i class="bi bi-grid-1x2-fill"></i> Dashboard
        </a>
      </li>
      <li>
        <a href="/data" class="{{ 'active' if request.endpoint == 'data' }}">
          <i class="bi bi-file-earmark-text-fill"></i> Documents
        </a>
      </li>
      <li>
        <a href="/query" class="{{ 'active' if request.endpoint == 'query_page' }}">
          <i class="bi bi-chat-dots-fill"></i> Query Brain
        </a>
      </li>
      <li>
        <a href="/reports" class="{{ 'active' if request.endpoint in ('reports_page', 'report_view') }}">
          <i class="bi bi-journal-text"></i> Reports
        </a>
      </li>
      <li>
        <a href="/hunches" class="{{ 'active' if request.endpoint == 'hunches_page' }}">
          <i class="bi bi-lightbulb-fill"></i> Hunches
        </a>
      </li>

      <li class="nav-section" style="margin-top:12px;">Documents</li>
      <li><a href="/data?tab=okrs"        class="{{ 'active' if request.endpoint == 'data' and request.args.get('tab','okrs') == 'okrs' }}"><i class="bi bi-bullseye"></i> OKRs</a></li>
      <li><a href="/data?tab=bets"        class="{{ 'active' if request.endpoint == 'data' and request.args.get('tab') == 'bets' }}"><i class="bi bi-lightning-fill"></i> Strategic Bets</a></li>
      <li><a href="/data?tab=competitive" class="{{ 'active' if request.endpoint == 'data' and request.args.get('tab') == 'competitive' }}"><i class="bi bi-diagram-3-fill"></i> Competitive</a></li>
      <li><a href="/data?tab=market"      class="{{ 'active' if request.endpoint == 'data' and request.args.get('tab') == 'market' }}"><i class="bi bi-graph-up-arrow"></i> Market Shifts</a></li>
      <li><a href="/data?tab=jobs"        class="{{ 'active' if request.endpoint == 'data' and request.args.get('tab') == 'jobs' }}"><i class="bi bi-person-check-fill"></i> Jobs to Be Done</a></li>
    </ul>

    <div class="sidebar-footer">
      <span class="date">Q1 2024</span>
      <span class="dot-live">● Live</span>
    </div>
  </nav>

  <!-- ── Main ────────────────────────────────────────────────────────────── -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

</div>

<!-- Vendor JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

{% block scripts %}{% endblock %}
</body>
</html>
