{% extends "base.html" %}

{% block content %}

<div class="page-header">
  <div>
    <div class="page-title"><i class="bi bi-file-earmark-text" style="color:var(--primary);margin-right:8px;"></i>{{ title }}</div>
    <div class="page-subtitle">Saved report</div>
  </div>
  <div style="display:flex;gap:10px;align-items:center;">
    <a href="/reports/{{ filename }}?dl=1" download="{{ filename }}"
       style="font-size:12px;font-weight:500;color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:var(--card);">
      <i class="bi bi-download"></i> Download .md
    </a>
    <a href="/reports" style="font-size:12px;font-weight:500;color:var(--primary);text-decoration:none;display:flex;align-items:center;gap:5px;">
      <i class="bi bi-arrow-left"></i> All Reports
    </a>
  </div>
</div>

<div class="page-body">
  <div class="card">
    <div class="card-body" style="padding:32px 36px;">
      <div class="markdown-body">
        {{ content | safe }}
      </div>
    </div>
  </div>
</div>

{% endblock %}
